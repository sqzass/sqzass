<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="cl9udblunts">
    <title>sqzass</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃟</text></svg>">
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            display: grid;
            /* center pls */
            place-items: center;
            justify-content: center;
        }

        .rain {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .rain i {
            position: absolute;
            display: block;
            color: #d40000;
            font-style: normal;
            font-size: var(--fs);
            line-height: 2;
            opacity: var(--op);
            /* 180 = upside down cross, adding more keeps the slant. negative cuz it matches the direction better */
            transform: rotate(-200deg);
            animation: fall var(--dur) linear var(--delay) infinite;
            will-change: left, top;
        }

        @keyframes fall {
            from {
                left: var(--x);
                top: var(--y);
            }

            to {
                left: calc(var(--x) + var(--dx));
                top: calc(var(--y) + var(--dy));
            }
        }

        /* i love that i can name tags whatever i want */
        pbutcooler {
            background: linear-gradient(to right, hwb(0 0% 68%), hwb(0 0% 30%));
            /* FUCK webkit... cough amen */
            -webkit-background-clip: text;
            /* i dont think i need webkit if i have this..? fuck it we ball */
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
        }

        main,
        footer {
            transition: opacity 1s ease;
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 42ch;
            width: 100%;
            /* everything lives on the midline now */
            text-align: center;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            z-index: 1;
        }

        body.text-hidden main,
        body.text-hidden footer {
            opacity: 0;
            pointer-events: none;
        }

        .abtme {
            color: #999;
            /* doesnt look as good as i thought it would, leave in comment for later i guess */
            /* text-indent: 1rem; */
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
        }

        /* actual status text. parent keeps it centered, js just fades it */
        .abtme span {
            display: inline-block;
            transition: opacity 0.3s ease;
        }

        a {
            color: #fff;
        }

        a:hover {
            color: #d40000;
        }
    </style>
</head>

<body>
    <div class="rain" id="rain" aria-hidden="true"></div>
    <main>
        <pbutcooler>sqzass<span class="nose" aria-hidden="true"></span></pbutcooler>
        <p class="abtme"><span>that pretty mf.</span></p>
        <p>worked on <a href="https://millyrack.pages.dev">doiksub</a>.</p> <!-- send to docs instead of github -->
        <p>github: <a href="https://github.com/sqzass">@sqzass</a>.</p>
    </main>
    <footer>
        <p>press g to hide text if you like the 'rain'.</p>
    </footer>
    <script>
        const rain = document.getElementById("rain");
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const count = vw < 600 ? 40 : 78;

        // all my homies HATE pi
        const angle = 20 * Math.PI / 180;
        const sinA = Math.sin(angle);
        const cosA = Math.cos(angle);

        for (let i = 0; i < count; i++) {
            const drop = document.createElement("i");
            drop.textContent = "✝"; // it is raining men crosses. hallelujah.

            // fidget with this. high num means more cozy, lower is the opposite. thunderstorm maybe? :eyes:
            // yo i am NOT fucking doing a thunderstorm. ion hate myself that much.
            const dur = 1.5 + Math.random() * 0.9;

            const len = 12 + Math.random() * 14; // ~glyph size now, still used to seed spawns
            const drift = vh * Math.tan(angle);
            const x0 = -drift + Math.random() * (vw + drift);
            const y0 = -len - Math.random() * vh * 0.55;
            const needDown = (vh + len) - y0;
            const travel = (needDown / cosA) * 1.05;

            const dx = travel * sinA;
            const dy = travel * cosA;

            // all this for some fuckin rain?
            drop.style.setProperty("--x", x0 + "px");
            drop.style.setProperty("--y", y0 + "px");
            drop.style.setProperty("--dx", dx + "px");
            drop.style.setProperty("--dy", dy + "px");
            drop.style.setProperty("--fs", len + "px");
            drop.style.setProperty("--dur", dur + "s");
            drop.style.setProperty("--delay", (-Math.random() * dur) + "s");
            drop.style.setProperty("--op", (0.1 + Math.random() * 0.25).toFixed(2));

            // thank god for yt tutorials
            rain.appendChild(drop);
        }

        const abtmeTexts = [
            "i jest!",
            "jester",
            "uhh i forgot",
            "7xvn enjoyer.", // goated artist - agreed
            "doik... sub?!",
            "customprofile saved my eyes",
            "click me",
            "chat i fixed /avatar"
        ];

        const abtmeEl = document.querySelector(".abtme");
        if (abtmeEl) {
            const statusEl = abtmeEl.querySelector("span");

            let abtmeIndex = Math.floor(Math.random() * abtmeTexts.length);
            statusEl.textContent = abtmeTexts[abtmeIndex];

            abtmeEl.style.cursor = "help"; // subtle

            let swapping = false; // no double honking mid-animation

            abtmeEl.addEventListener("click", () => {
                if (swapping) return;
                swapping = true;

                // fade out...
                statusEl.style.opacity = "0";

                setTimeout(() => {
                    // ...swap while invisible (parent re-centers it for free)...
                    abtmeIndex = (abtmeIndex + 1) % abtmeTexts.length;
                    statusEl.textContent = abtmeTexts[abtmeIndex];

                    // ...and fade back in
                    requestAnimationFrame(() => {
                        statusEl.style.opacity = "1";

                        setTimeout(() => {
                            swapping = false;
                        }, 300);
                    });
                }, 300);
            });
        }

        document.addEventListener("keydown", (e) => {
            if (e.key.toLowerCase() === "g") {
                document.body.classList.toggle("text-hidden");
            }
        });
    </script>
</body>

</html>
